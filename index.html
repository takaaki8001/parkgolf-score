<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176a4b"><title>パークゴルフ スコア帳</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="スコア帳"><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#173a2c;background:#eef4ef}*{box-sizing:border-box}body{margin:0}header{background:#176a4b;color:white;padding:18px 16px;position:sticky;top:0;z-index:3;box-shadow:0 2px 10px #0002}header strong{font-size:19px}main{max-width:650px;margin:auto;padding:16px 14px 80px}.card{background:white;border-radius:16px;padding:17px;margin:0 0 14px;box-shadow:0 2px 12px #1232}.muted{color:#65766c;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.grid{display:grid;gap:9px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:12px 13px;background:#176a4b;color:white;font-weight:700;min-height:43px}button.secondary{background:#e7f0ea;color:#185b42}button.outline{background:white;border:1px solid #c6d8cd;color:#176a4b}button.danger{background:#fff0ef;color:#aa3831}button:disabled{opacity:.35;cursor:default}input,select{width:100%;padding:12px;border:1px solid #c7d9cd;border-radius:10px;background:white;color:#173a2c;min-width:0}label{display:block;font-weight:650;font-size:14px;margin:10px 0 5px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 14px 0;max-width:650px;margin:auto}.tabs button{flex:1;white-space:nowrap;background:#dbe9df;color:#245d42}.tabs button.active{background:white;color:#176a4b}.scoregrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.scorebtn{font-size:26px;min-height:67px;background:#eaf2ed;color:#184d35;border:1px solid #d1e2d7}.scorebtn.common{background:#d2e8da}.scorebtn:active{transform:scale(.96)}.parButtons{display:flex;gap:3px}.parChoice{flex:1;min-width:0;padding:10px 0;min-height:42px;background:#e5eee8;color:#205b41;border:2px solid transparent}.parChoice.chosen{background:#176a4b;color:white;border-color:#105238}.player{flex:1;min-width:0;padding:10px 5px;text-align:center;background:#eef3ef;color:#2d6249;border:2px solid transparent;border-radius:12px}.player.active{border-color:#176a4b;background:#d7ebde}.player b{display:block;font-size:25px;margin:5px 0}.players{display:flex;gap:7px}.pill{font-size:12px;background:#e5f0e9;padding:5px 9px;border-radius:30px;color:#176a4b}.progress{height:7px;border-radius:5px;background:#e2ece5;overflow:hidden;margin:10px 0}.progress span{display:block;background:#248657;height:100%}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 4px;border-bottom:1px solid #e4ebe6;text-align:center}th:first-child,td:first-child{text-align:left}th{color:#5b6c61}.scroll{overflow-x:auto}.notice{border-left:4px solid #58a476;padding:10px;background:#edf6ef;font-size:13px;border-radius:5px}.small{font-size:12px}.spacer{height:8px}.hidden{display:none!important}footer{font-size:12px;text-align:center;color:#6e7b72;padding:20px} .holepar{font-size:13px;color:#627b6a}.numinput{max-width:75px;text-align:center;padding:9px} .entry{display:flex;align-items:center;gap:8px;margin:7px 0}.entry span{width:60px;font-size:13px} .entry input{flex:1}.right{text-align:right} .tag{font-size:12px;border-radius:6px;background:#f0f4f1;padding:4px 6px}
</style></head><body><header><div style="max-width:650px;margin:auto" class="row"><strong>⛳ パークゴルフ スコア帳</strong><span class="small">Ver.1.0</span></div></header><nav class="tabs" id="tabs"><button data-tab="home">プレー</button><button data-tab="courses">コース</button><button data-tab="history">履歴</button><button data-tab="settings">設定</button></nav><main id="app"></main><footer>データはこのブラウザ内に保存されます。大切な記録は設定からバックアップしてください。</footer><script>
'use strict';const KEY='pg_score_prototype_v1';const seed={courses:[{id:'demo',name:'サンプルパークゴルフ場',sections:[{id:'demoA',name:'Aコース',pars:[4,4,4,4,3,3,3,4,4]},{id:'demoB',name:'Bコース',pars:[4,3,4,4,3,4,3,4,4]}]}],sessions:[],current:null};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)};if(!Array.isArray(state.courses)||!Array.isArray(state.sessions))state=structuredClone(seed);let tab='home',editor=null,active=0,more=false,historyId=null;const app=document.getElementById('app');const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存できませんでした。端末の空き容量やブラウザ設定をご確認ください。')}};const fmt=d=>new Date(d).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});const sum=a=>a.reduce((x,y)=>x+(Number(y)||0),0);const allSections=()=>state.courses.flatMap(c=>c.sections.map(s=>({course:c,section:s})));const findSection=id=>allSections().find(x=>x.section.id===id);const cur=()=>state.current;const round=()=>cur()?.rounds.at(-1);function goto(t){tab=t;editor=null;render()}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));app.innerHTML=tab==='home'?home():tab==='courses'?courses():tab==='history'?history():settings();}document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)goto(b.dataset.tab)});
function home(){if(!cur())return `<section class="card"><h2>新しいプレー</h2><div class="notice">最初に人数と名前を決め、9ホールのコースを選びます。終了後は別の9ホールを追加できます。</div><label>人数</label><select id="playerCount" onchange="updateNames()">${[1,2,3,4].map(n=>`<option value="${n}" ${n===3?'selected':''}>${n}人</option>`).join('')}</select><div id="names">${nameFields(3)}</div><label>最初のコース</label><select id="startSection">${allSections().map(x=>`<option value="${esc(x.section.id)}">${esc(x.course.name)} / ${esc(x.section.name)}（PAR ${sum(x.section.pars)}）</option>`).join('')}</select><div class="spacer"></div><button style="width:100%" onclick="start()" ${allSections().length?'':'disabled'}>プレー開始</button></section><section class="card"><h3>使い方</h3><p class="muted">ホールが終わったら、申告された打数を各プレイヤーに入力します。入力順は自由です。9ホール終了後は別コースを追加するか、プレーを終了できます。</p></section>`;
let s=cur(),r=round(),idx=r.scores.findIndex(row=>row.some(v=>v===null)),done=idx===-1;let h=done?8:Math.max(0,idx);if(s.viewHole!==undefined)h=Math.min(8,Math.max(0,s.viewHole));let complete=r.scores.every(row=>row.every(v=>v!==null));let rows=r.scores[h];if(active>=s.players.length)active=0;const filled=r.scores.flat().filter(x=>x!==null).length;return `<section class="card"><div class="row"><div><h2 style="margin:0">${esc(r.courseName)} / ${esc(r.sectionName)}</h2><span class="muted">${s.rounds.length}周目・${fmt(s.date)}</span></div><span class="pill">${h+1} / 9 H</span></div><div class="progress"><span style="width:${filled/(9*s.players.length)*100}%"></span></div><div class="row"><strong>第${h+1}ホール</strong><span class="holepar">PAR ${r.pars[h]}</span></div><div class="spacer"></div><div class="players">${s.players.map((p,i)=>`<button class="player ${active===i?'active':''}" onclick="selectPlayer(${i})"><span>${esc(p)}</span><b>${rows[i]??'—'}</b><span class="small">${rows[i]===null?'未入力':'入力済'}</span></button>`).join('')}</div><p class="muted" style="text-align:center">「${esc(s.players[active])}」の打数を選択</p><div class="scoregrid">${[1,2,3,4,5,6,7,8].map(n=>`<button class="scorebtn ${n>=3&&n<=5?'common':''}" onclick="enterScore(${h},${n})">${n}</button>`).join('')}</div><div class="row" style="margin-top:10px"><button class="secondary small" onclick="toggleMore()">${more?'▲ 閉じる':'＋ 9打以上'}</button><span class="muted">${filled} / ${9*s.players.length}件入力済</span></div>${more?`<div class="grid four" style="margin-top:8px">${[9,10,11,12].map(n=>`<button class="outline" onclick="enterScore(${h},${n})">${n}</button>`).join('')}</div><div class="entry"><span>13打以上</span><input type="number" id="extraScore" min="13" max="99" placeholder="打数"><button onclick="enterExtra(${h})">入力</button></div>`:''}<div class="row" style="margin-top:18px"><button class="secondary" onclick="changeHole(-1)" ${h===0?'disabled':''}>← 前へ</button><button class="secondary" onclick="changeHole(1)" ${h===8?'disabled':''}>次へ →</button></div></section><section class="card"><div class="row"><h3>現在のスコア</h3><span class="tag">${s.rounds.length}周目</span></div><div class="scroll"><table><thead><tr><th>名前</th><th>今の9H</th><th>本日合計</th></tr></thead><tbody>${s.players.map((p,i)=>`<tr><td>${esc(p)}</td><td>${sum(r.scores.map(x=>x[i]))}</td><td><strong>${sum(s.rounds.flatMap(a=>a.scores.map(x=>x[i])))}</strong></td></tr>`).join('')}</tbody></table></div><button class="outline" style="width:100%;margin-top:10px" onclick="showCard()">9ホールの一覧を見る</button>${complete?`<div class="notice" style="margin-top:12px">この9ホールは全員分の入力が完了しました。</div><button style="width:100%;margin-top:10px" onclick="chooseNext()">次の9ホールを追加</button>`:''}<button class="secondary" style="width:100%;margin-top:10px" onclick="finish()">本日のプレーを終了</button></section>`}
function nameFields(n){return Array.from({length:n},(_,i)=>`<label>${i+1}人目</label><input class="pname" maxlength="24" value="${i===0?'自分':'プレイヤー'+(i+1)}" aria-label="${i+1}人目の名前">`).join('')}function updateNames(){let old=[...document.querySelectorAll('.pname')].map(x=>x.value);let n=+document.getElementById('playerCount').value;document.getElementById('names').innerHTML=nameFields(n);document.querySelectorAll('.pname').forEach((x,i)=>{if(old[i])x.value=old[i]})}function createRound(id){const f=findSection(id);if(!f)return null;return {id:uid(),courseId:f.course.id,sectionId:f.section.id,courseName:f.course.name,sectionName:f.section.name,pars:[...f.section.pars],scores:Array.from({length:9},()=>Array(state.current.players.length).fill(null))}}function start(){let players=[...document.querySelectorAll('.pname')].map((x,i)=>x.value.trim()||`プレイヤー${i+1}`);state.current={id:uid(),date:new Date().toISOString(),players,rounds:[],viewHole:0};const r=createRound(document.getElementById('startSection').value);if(!r){state.current=null;alert('コースを登録してください');return}state.current.rounds.push(r);active=0;more=false;save();render()}function selectPlayer(i){active=i;render()}function enterScore(h,n){if(!Number.isInteger(n)||n<1||n>99)return;const r=round();r.scores[h][active]=n;let next=r.scores[h].findIndex((v,i)=>v===null&&i>active);if(next<0)next=r.scores[h].findIndex(v=>v===null);if(next>=0)active=next;more=false;save();render()}function enterExtra(h){const n=Number(document.getElementById('extraScore').value);if(!Number.isInteger(n)||n<13||n>99){alert('13～99の整数を入力してください');return}enterScore(h,n)}function toggleMore(){more=!more;render()}function changeHole(d){cur().viewHole=Math.max(0,Math.min(8,(cur().viewHole??0)+d));active=0;more=false;save();render()}function showCard(){let s=cur(),r=round();alert(`${r.courseName} / ${r.sectionName}\n`+r.scores.map((row,i)=>`${i+1}H (PAR${r.pars[i]}): `+row.map((v,j)=>`${s.players[j]} ${v??'—'}`).join(' / ')).join('\n'))}function chooseNext(){if(!round().scores.every(row=>row.every(v=>v!==null))){alert('全員分のスコアを入力してください');return}const options=allSections();if(!options.length){alert('コースが登録されていません');return}app.innerHTML=`<section class="card"><h2>次の9ホールを追加</h2><p class="muted">同じコースをもう一度選ぶこともできます。</p><label>コース</label><select id="nextSection">${options.map(x=>`<option value="${esc(x.section.id)}">${esc(x.course.name)} / ${esc(x.section.name)}（PAR ${sum(x.section.pars)}）</option>`).join('')}</select><div class="grid two" style="margin-top:16px"><button class="secondary" onclick="render()">戻る</button><button onclick="addRound()">追加して開始</button></div></section>`}function addRound(){let r=createRound(document.getElementById('nextSection').value);if(!r)return;cur().rounds.push(r);cur().viewHole=0;active=0;save();render()}function finish(){if(!confirm('本日のプレーを終了して履歴に保存しますか？\n未入力のホールは空欄のまま保存されます。'))return;const s=cur();s.finished=new Date().toISOString();delete s.viewHole;state.sessions.unshift(s);state.current=null;save();historyId=s.id;tab='history';render()}
function courses(){if(editor!==null)return courseEditor();return `<section class="card"><div class="row"><h2>コースマスター</h2><button onclick="newCourse()">＋ 新規登録</button></div><p class="muted">パークゴルフ場ごとに9ホールのコースを登録できます。何度でも再利用できます。</p></section>${state.courses.map(c=>`<section class="card"><div class="row"><h3>${esc(c.name)}</h3><button class="secondary" onclick="editCourse('${c.id}')">編集</button></div>${c.sections.map(s=>`<div class="row" style="padding:9px 0;border-top:1px solid #edf0ee"><span>${esc(s.name)}</span><span class="muted">9H / PAR ${sum(s.pars)}</span></div>`).join('')}</section>`).join('')}`}
function newCourse(){editor={id:null,name:'',sections:[{id:uid(),name:'Aコース',pars:[4,4,4,4,3,3,3,4,4]}]};render()}function editCourse(id){const c=state.courses.find(x=>x.id===id);if(!c)return;editor=structuredClone(c);render()}function courseEditor(){return `<section class="card"><h2>${editor.id?'コースを編集':'新しいコースを登録'}</h2><label>パークゴルフ場名</label><input id="courseName" maxlength="70" value="${esc(editor.name)}" placeholder="例：○○パークゴルフ場"><p class="muted">9ホールを1コースとして登録します。PARは3・4・5のボタンから選択できます。</p><div id="sectionEditors">${editor.sections.map((s,i)=>sectionEditor(s,i)).join('')}</div><button class="secondary" style="width:100%" onclick="addSection()">＋ 9ホールのコースを追加</button><div class="grid two" style="margin-top:15px"><button class="secondary" onclick="editor=null;render()">キャンセル</button><button onclick="saveCourse()">マスター保存</button></div>${editor.id?`<button class="danger" style="width:100%;margin-top:12px" onclick="deleteCourse()">このパークゴルフ場を削除</button>`:''}</section>`}function sectionEditor(s,i){return `<div class="card" style="background:#f4f8f5;border:1px solid #dbe9df;margin-top:14px"><div class="row"><h3>${i+1}番目のコース</h3><button class="danger small" onclick="removeSection(${i})">削除</button></div><label>コース名</label><input class="sectionName" data-index="${i}" maxlength="50" value="${esc(s.name)}"><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px">${s.pars.map((p,h)=>`<div><label style="font-size:12px">${h+1}H PAR</label><div class="parButtons" role="group" aria-label="${h+1}ホールのPAR">${[3,4,5].map(n=>`<button type="button" class="parChoice ${p===n?'chosen':''}" aria-pressed="${p===n}" onclick="setPar(${i},${h},${n})">${n}</button>`).join('')}</div></div>`).join('')}</div><p class="muted">PAR合計：${sum(s.pars)}（保存時に再計算）</p></div>`}function setPar(section,hole,value){if(!editor||![3,4,5].includes(value))return;syncEditor();editor.sections[section].pars[hole]=value;render()}function syncEditor(){if(!editor)return;const n=document.getElementById('courseName');if(n)editor.name=n.value;document.querySelectorAll('.sectionName').forEach(x=>editor.sections[+x.dataset.index].name=x.value);}function addSection(){syncEditor();editor.sections.push({id:uid(),name:String.fromCharCode(65+editor.sections.length)+'コース',pars:[4,4,4,4,3,3,3,4,4]});render()}function removeSection(i){syncEditor();if(editor.sections.length===1){alert('少なくとも1コース必要です');return}editor.sections.splice(i,1);render()}function saveCourse(){syncEditor();editor.name=editor.name.trim();if(!editor.name||editor.sections.some(s=>!s.name.trim()||s.pars.length!==9||s.pars.some(p=>!Number.isInteger(p)||p<3||p>5))){alert('パークゴルフ場名、コース名、各ホールのPAR（3・4・5）を確認してください');return}editor.sections.forEach(s=>s.name=s.name.trim());if(editor.id){const i=state.courses.findIndex(x=>x.id===editor.id);state.courses[i]=editor}else{editor.id=uid();state.courses.push(editor)}editor=null;save();render()}function deleteCourse(){if(state.current?.rounds?.some(r=>r.courseId===editor?.id)){alert('進行中のプレーで使用しているため、終了後に削除してください。');return}if(!confirm('このパークゴルフ場のマスターを削除しますか？\n過去のプレー履歴は残ります。'))return;state.courses=state.courses.filter(c=>c.id!==editor.id);editor=null;save();render()}
function history(){if(historyId){const s=state.sessions.find(x=>x.id===historyId);if(s)return historyDetail(s);historyId=null}return `<section class="card"><h2>プレー履歴</h2><p class="muted">終了したプレーの記録を表示します。</p></section>${state.sessions.length?state.sessions.map(s=>`<section class="card"><div class="row"><div><strong>${fmt(s.date)}</strong><p class="muted">${esc(s.players.join('・'))} / ${s.rounds.length*9}ホール</p></div><button class="secondary" onclick="historyId='${s.id}';render()">詳細</button></div><div class="row">${s.players.map((p,i)=>`<span class="tag">${esc(p)}：${sum(s.rounds.flatMap(r=>r.scores.map(row=>row[i])))}打</span>`).join('')}</div></section>`).join(''):'<section class="card"><p class="muted">まだ履歴はありません。</p></section>'}`}
function historyDetail(s){const totals=s.players.map((p,i)=>({p,total:sum(s.rounds.flatMap(r=>r.scores.map(row=>row[i]))),i}));return `<section class="card"><button class="secondary" onclick="historyId=null;render()">← 履歴に戻る</button><h2 style="margin-top:14px">${fmt(s.date)}</h2><div class="scroll"><table><thead><tr><th>プレイヤー</th><th>合計打数</th></tr></thead><tbody>${totals.map(x=>`<tr><td>${esc(x.p)}</td><td><strong>${x.total}</strong></td></tr>`).join('')}</tbody></table></div></section>${s.rounds.map((r,k)=>`<section class="card"><h3>${k+1}周目：${esc(r.courseName)} / ${esc(r.sectionName)}</h3><div class="scroll"><table><thead><tr><th>H</th><th>PAR</th>${s.players.map(p=>`<th>${esc(p)}</th>`).join('')}</tr></thead><tbody>${r.scores.map((row,h)=>`<tr><td>${h+1}</td><td>${r.pars[h]}</td>${row.map(v=>`<td>${v??'—'}</td>`).join('')}</tr>`).join('')}<tr><th>計</th><th>${sum(r.pars)}</th>${s.players.map((_,i)=>`<th>${sum(r.scores.map(row=>row[i]))}</th>`).join('')}</tr></tbody></table></div></section>`).join('')}<section class="card"><button class="secondary" style="width:100%" onclick="copyHistory('${s.id}')">結果をテキストでコピー</button><button class="danger" style="width:100%;margin-top:10px" onclick="deleteHistory('${s.id}')">この履歴を削除</button></section>`}function copyHistory(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;const txt=`パークゴルフ記録 ${fmt(s.date)}\n`+s.rounds.map((r,k)=>`${k+1}周目 ${r.courseName} ${r.sectionName}`).join('\n')+'\n'+s.players.map((p,i)=>`${p}: ${sum(s.rounds.flatMap(r=>r.scores.map(row=>row[i])))}打`).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>alert('コピーしました')).catch(()=>prompt('以下をコピーしてください',txt));else prompt('以下をコピーしてください',txt)}function deleteHistory(id){if(!confirm('この履歴を削除しますか？元に戻せません。'))return;state.sessions=state.sessions.filter(x=>x.id!==id);historyId=null;save();render()}
function settings(){return `<section class="card"><h2>データ管理</h2><p class="muted">プレー記録はお使いの端末内に保存され、別の端末には自動同期されません。iPhoneでは、ホーム画面から起動した場合と、SafariやGoogle Chromeなどのブラウザから開いた場合で、記録が別々に保存されることがあります。ホーム画面に追加した後は、ホーム画面のアイコンから起動してご利用ください。</p><button style="width:100%" onclick="exportData()">バックアップ（JSON）を保存</button><label>バックアップから復元</label><input type="file" id="importFile" accept=".json,application/json"><button class="secondary" style="width:100%;margin-top:8px" onclick="importData()">ファイルを読み込む</button><div class="notice" style="margin-top:14px">ブラウザのデータ削除や機種変更で記録が消える場合があります。定期的にバックアップしてください。</div></section><section class="card"><h3>この試作版について</h3><p class="muted">1～4人、9ホール単位、コースマスター、入力途中の保存、履歴に対応。インターネット接続がなくても、HTMLファイルを開ける環境なら画面自体は動きます。ただしブラウザによってはローカルHTMLの保存領域が安定しない場合があります。</p><p class="muted">ホーム画面から起動できる正式なPWA化には、HTTPS配信・アプリ用アイコン・Service Workerの追加が必要です。</p></section>`}function exportData(){const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='parkgolf-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(){const f=document.getElementById('importFile').files[0];if(!f){alert('ファイルを選んでください');return}try{const obj=JSON.parse(await f.text()),d=obj.data;if(!d||!Array.isArray(d.courses)||!Array.isArray(d.sessions)||!('current'in d))throw Error('形式が異なります');if(!confirm('現在のコース・履歴・進行中のプレーをバックアップの内容で置き換えますか？'))return;state=d;save();goto('home');alert('復元しました')}catch(e){alert('読み込みに失敗しました：'+e.message)}}render();
</script><script>window.__pgOriginal={home,start,history,historyDetail,settings,render,finish,importData};</script><script src="./enhancements.js"></script><script src="./share.js"></script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
